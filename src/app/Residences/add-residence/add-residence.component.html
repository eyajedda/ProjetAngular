<form [formGroup]="residenceForm" (ngSubmit)="addResidence()" class="container mt-4">
    <div class="form-group">
      <label>Name:</label>
      <input formControlName="name" class="form-control">
      <div *ngIf="residenceForm.get('name')?.invalid && residenceForm.get('name')?.touched" class="text-danger">
        <span *ngIf="residenceForm.get('name')?.hasError('required')">Champ obligatoire</span>
        <span *ngIf="residenceForm.get('name')?.hasError('minlength')">Minimum 3 caractères</span>
      </div>
    </div>
  
    <div class="form-group">
      <label>Address:</label>
      <input formControlName="address" class="form-control">
      <div *ngIf="residenceForm.get('address')?.invalid && residenceForm.get('address')?.touched" class="text-danger">
        <span>Champ obligatoire</span>
      </div>
    </div>
  
    <div class="form-group">
        <label>Image de la résidence :</label>
        <div class="drop-zone" 
             (dragover)="onFileDropped($event)" 
             (drop)="onFileDropped($event)">
          <input type="file" accept="image/*" (change)="onFileSelected($event)" class="form-control-file">
        </div>
    
        <!-- Aperçu de l'image -->
        <div *ngIf="imagePreview" class="mt-3">
          <img [src]="imagePreview" alt="Aperçu de l'image" class="img-thumbnail" style="max-width: 200px;">
        </div>
    
        <div *ngIf="residenceForm.get('image')?.invalid && residenceForm.get('image')?.touched" class="text-danger">
          <span>Ce champ est obligatoire</span>
        </div>
      </div>
  
    <div class="form-group">
      <label>Status:</label>
      <select formControlName="status" class="form-control">
        <option value="Disponible">Disponible</option>
        <option value="En Construction">En Construction</option>
        <option value="Vendu">Vendu</option>
      </select>
    </div>
  
    <h3 class="mt-4">Appartements</h3>
    <button type="button" class="btn btn-secondary mb-3" (click)="addApartment()">Ajouter un appartement</button>
    
    <div formArrayName="apartments" *ngFor="let apt of apartments.controls; let i = index" class="border p-3 mb-3">
      <div [formGroup]="apt">
        <div class="form-group">
          <label>Residence:</label>
          <input formControlName="residence" class="form-control">
        </div>
  
        <div class="form-group">
          <label>Apartment Number:</label>
          <input formControlName="apartmentNumber" class="form-control">
        </div>
  
        <div class="form-group">
          <label>Floor Number:</label>
          <input formControlName="floorNumber" class="form-control">
        </div>
  
        <div class="form-group form-check">
          <input type="checkbox" formControlName="terrace" class="form-check-input">
          <label class="form-check-label">Terrace</label>
        </div>
  
        <div class="form-group">
          <label>Surface Terrace:</label>
          <input formControlName="surfaceTerrace" class="form-control">
        </div>
  
        <button type="button" class="btn btn-danger mt-2" (click)="removeApartment(i)">Supprimer</button>
      </div>
    </div>

        <div>
        <button type="submit" class="btn btn-primary mt-3 my-2" [disabled]="residenceForm.invalid">Ajouter Résidence</button>
       </div>

  </form>
